on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  build-docker:
    runs-on: docker
    needs: []
    timeout_minutes: 30
    steps:
      - name: Set Path  
        run: export PATH := $(PATH):/root/.cargo/bin
      - name: Build
        run: make package-runner-amd64 VERSION=1.0.0 
