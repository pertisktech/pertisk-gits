on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  build-runner:
    runs-on: docker
    needs: []
    timeout_minutes: 30
    steps:
      - name: Build  Runner
        env:
          PERTISK_FORCE_DOCKER_BUILD: "1"
        run: make package-runner-amd64 VERSION=1.0.0

  build-package:
    runs-on: docker
    needs: []
    timeout_minutes: 30
    steps:
      - name: Build  Package
        env:
          PERTISK_FORCE_DOCKER_BUILD: "1"
        run: make package-amd64 VERSION=1.0.0
