[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/api",
    "crates/gateway",
    "crates/git",
    "crates/cicd",
    "crates/runner",
    "crates/worker",
    "crates/registry",
    "crates/search",
]
default-members = ["crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pertisk Tech"]

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "9"
pingora-proxy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-zstd", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.20", features = ["derive"] }
serde_yaml = "0.9"
prometheus = "0.13"
