# Branch / deploy workflow (GitLab-style manual runs)
#
#   main push              → automatic CI (build) + deploy dev; deploy-qa-manual / deploy-uat-manual wait for play
#   feature/* + manual     → build/test on feature branch (no auto CI on push)
#   Run pipeline + qa/uat  → env deploy chains (automatic)
#
# UI: Pipelines → Run pipeline → branch/tag + environment
# Docs: docs/CICD_WORKFLOWS.md
# API: POST .../pipelines/trigger  { ref_name, commit_sha, event_type: manual, environment }
#       POST .../pipelines/{run_id}/jobs/{job_id}/play  (manual jobs on push runs)
#
# Secrets (Group or Repo → Secrets):
#   dev  HARBOR_URL = harbor-dev.tools.thaidevops.co
#   qa   HARBOR_URL = harbor-qa.tools.thaidevops.co
#   uat  HARBOR_URL = harbor-uat.tools.thaidevops.co

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Feature branch: manual build only (GitLab: only: feature/*, when: manual) ---
  build-feature:
    runs-on: kubernetes
    if:
      branch: feature/*
      event: manual
    steps:
      - name: build feature branch
        run: echo "building feature branch..."

  test-feature:
    runs-on: kubernetes
    needs: [build-feature]
    if:
      branch: feature/*
      event: manual
    steps:
      - name: test feature branch
        run: echo "testing feature branch..."

  unit-test:
    runs-on: kubernetes
    if:
      branch: main
      event: push
    steps:
      - name: unit test
        run: echo "unit test ok"

  code-coverage:
    runs-on: kubernetes
    needs: [unit-test]
    if:
      branch: main
      event: push
    steps:
      - name: code coverage
        run: echo "code coverage ok"

  build-docker:
    runs-on: kubernetes
    needs: [unit-test]
    if:
      branch: main
      event: push
    steps:
      - name: build docker
        run: echo "build docker ok"

  release-docker:
    runs-on: kubernetes
    needs: [build-docker, code-coverage]
    if:
      branch: main
      event: push
    steps:
      - name: release docker
        run: echo "release docker ok"

  deploy-dev:
    runs-on: kubernetes
    environment: dev
    needs: [release-docker]
    if:
      branch: main
      environment: dev
      event: push
    steps:
      - name: deploy dev
        run: echo "deploy dev → ${{ secrets.HARBOR_URL }}"

  health-check-dev:
    runs-on: kubernetes
    environment: dev
    needs: [deploy-dev]
    if:
      branch: main
      environment: dev
      event: push
    steps:
      - name: health check
        run: echo "health check dev ok"

  e2e-test-dev:
    runs-on: kubernetes
    environment: dev
    needs: [health-check-dev]
    if:
      branch: main
      environment: dev
      event: push
    steps:
      - name: end-to-end test
        run: echo "e2e dev ok"

  deploy-qa:
    runs-on: kubernetes
    environment: qa
    needs: []
    if:
      environment: qa
      event: manual
    steps:
      - name: deploy qa
        run: echo "deploy qa → ${{ secrets.HARBOR_URL }}"

  health-check-qa:
    runs-on: kubernetes
    environment: qa
    needs: [deploy-qa]
    if:
      environment: qa
      event: manual
    steps:
      - name: health check
        run: echo "health check qa ok"

  e2e-test-qa:
    runs-on: kubernetes
    environment: qa
    needs: [health-check-qa]
    if:
      environment: qa
      event: manual
    steps:
      - name: end-to-end test
        run: echo "e2e qa ok"

  deploy-uat:
    runs-on: kubernetes
    environment: uat
    needs: []
    if:
      environment: uat
      event: manual
    steps:
      - name: deploy uat
        run: echo "deploy uat → ${{ secrets.HARBOR_URL }}"

  health-check-uat:
    runs-on: kubernetes
    environment: uat
    needs: [deploy-uat]
    if:
      environment: uat
      event: manual
    steps:
      - name: health check
        run: echo "health check uat ok"

  e2e-test-uat:
    runs-on: kubernetes
    environment: uat
    needs: [health-check-uat]
    if:
      environment: uat
      event: manual
    steps:
      - name: end-to-end test
        run: echo "e2e uat ok"

  # GitLab-style: visible on main push pipelines — click play to deploy (when: manual)
  deploy-qa-manual:
    runs-on: kubernetes
    environment: qa
    needs: [e2e-test-dev]
    if:
      branch: main
      event: manual
    steps:
      - name: deploy qa (manual play)
        run: echo "deploy qa → ${{ secrets.HARBOR_URL }}"

  deploy-uat-manual:
    runs-on: kubernetes
    environment: uat
    needs: [e2e-test-dev]
    if:
      branch: main
      event: manual
    steps:
      - name: deploy uat (manual play)
        run: echo "deploy uat → ${{ secrets.HARBOR_URL }}"
