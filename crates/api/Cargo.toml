[package]
name = "pertisk-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pertisk-api"
path = "src/main.rs"

[dependencies]
pertisk-domain = { path = "../domain" }
pertisk-git = { path = "../git" }
pertisk-registry = { path = "../registry" }
pertisk-cicd = { path = "../cicd" }
pertisk-worker = { path = "../worker" }
pertisk-search = { path = "../search" }
anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls", "sync"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
quick-xml = { version = "0.37", features = ["serialize"] }
flate2 = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
urlencoding = "2"
sysinfo = "0.33"
tar = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
