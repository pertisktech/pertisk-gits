services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pertisk
      POSTGRES_PASSWORD: pertisk
      POSTGRES_DB: pertisk_gits
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pertisk -d pertisk_gits"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pertisk
      MINIO_ROOT_PASSWORD: pertisksecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
