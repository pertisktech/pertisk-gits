# Default values for pertisk-runner.
# Register a runner in the UI first, then set runnerToken or existingSecret.

# Runner pool size — all replicas share one token and claim jobs independently.
# Max concurrent CI jobs ≈ number of ready pods (each pod runs one job at a time).
# Unlike GitLab Kubernetes executor (one manager spawns a pod per job), pertisk-runner
# executes shell steps inside each long-lived pod. See docs/RUNNERS.md.
replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75
  # Optional queue-depth scaling via custom/external metrics adapter.
  # Requires RUNNER_AUTOSCALE_SECRET on the API and a metrics adapter that
  # exposes pertisk_queued_jobs from GET /api/v1/internal/runner-autoscale.
  queueDepth:
    enabled: false
    metricName: pertisk_queued_jobs
    targetValue: 2
    apiUrl: ""
    secret: ""
# Spread replicas across nodes when replicaCount > 1
podAntiAffinity:
  enabled: true

# shell — run steps on the runner pod/host
# kubernetes — GitLab-style: manager pod spawns a Job pod per pipeline job
executor: shell

rbac:
  create: true

kubernetes:
  # Namespace for CI job pods (defaults to Helm release namespace)
  namespace: ""
  helperImage: curlimages/curl:8.12.1
  buildImage: alpine:3.21
  dindImage: docker:27.5.1-dind
  ttlSecondsAfterFinished: 600
  # Delete pertisk-job-* Jobs and script ConfigMaps on helm uninstall
  cleanupOnUninstall: true
  cleanupImage: bitnami/kubectl:1.31.4
  # nodeSelector: {}

image:
  repository: harbor.homelab.pertisk.com/pertisksoft/pertisk-proxy/runner
  tag: "0.2.32" # fixed arm64 build (explicit TARGETARCH in Makefile)
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Pertisk API base URL (no trailing slash)
apiUrl: "https://git.example.com"

# Runner token from POST /api/v1/runners/register (ptr_…)
# Prefer existingSecret in production instead of committing tokens.
runnerToken: ""

existingSecret:
  # name: pertisk-runner-secret
  name: ""
  key: token

# Optional — bare repo path when colocated with git server
reposRoot: ""

rustLog: "info,pertisk_runner=info"

# Mount host Docker socket for pipeline jobs with runs-on: docker
dockerSock:
  enabled: true
  hostPath: /var/run/docker.sock

# Run as root when docker.sock GID does not match container user
runAsRoot: false

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 4Gi

nodeSelector: {}

tolerations: []

# Override podAntiAffinity default (set non-empty affinity to replace entirely)
# affinity: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

serviceAccount:
  create: false
  name: ""
