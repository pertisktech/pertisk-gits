apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pertisk-runner.fullname" . }}
  labels:
    {{- include "pertisk-runner.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pertisk-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "pertisk-runner.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pertisk-runner.serviceAccountName" . }}
      {{- if .Values.runAsRoot }}
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      {{- else if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: "{{ .Values.image.repository }}:{{ include "pertisk-runner.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PERTISK_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pertisk-runner.fullname" . }}
                  key: api_url
            - name: PERTISK_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pertisk-runner.secretName" . }}
                  key: {{ .Values.existingSecret.key | default "token" }}
            - name: RUST_LOG
              value: {{ .Values.rustLog | quote }}
            - name: PERTISK_RUNNER_EXECUTOR
              value: {{ .Values.executor | quote }}
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if eq .Values.executor "kubernetes" }}
            - name: PERTISK_K8S_NAMESPACE
              value: {{ include "pertisk-runner.jobNamespace" . | quote }}
            - name: PERTISK_K8S_HELPER_IMAGE
              value: {{ .Values.kubernetes.helperImage | quote }}
            - name: PERTISK_K8S_BUILD_IMAGE
              value: {{ .Values.kubernetes.buildImage | quote }}
            - name: PERTISK_K8S_DIND_IMAGE
              value: {{ .Values.kubernetes.dindImage | quote }}
            - name: PERTISK_K8S_TTL_SECONDS
              value: {{ .Values.kubernetes.ttlSecondsAfterFinished | quote }}
            - name: PERTISK_K8S_SERVICE_ACCOUNT
              value: {{ include "pertisk-runner.serviceAccountName" . | quote }}
            - name: PERTISK_K8S_RELEASE
              value: {{ .Release.Name | quote }}
            {{- end }}
            {{- if .Values.reposRoot }}
            - name: PERTISK_REPOS_ROOT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "pertisk-runner.fullname" . }}
                  key: repos_root
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if and (not .Values.runAsRoot) .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: /var/lib/pertisk-runner
            {{- if and (ne .Values.executor "kubernetes") .Values.dockerSock.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
      volumes:
        - name: workspace
          emptyDir: {}
        {{- if and (ne .Values.executor "kubernetes") .Values.dockerSock.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.dockerSock.hostPath }}
            type: Socket
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "pertisk-runner.affinity" .) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
