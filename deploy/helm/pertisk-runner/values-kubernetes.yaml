# GitLab-style Kubernetes executor — manager Deployment + per-job Pods
executor: kubernetes

replicaCount: 1

serviceAccount:
  create: true

rbac:
  create: true

dockerSock:
  enabled: false

apiUrl: "https://git.example.com"

# Register with label: kubernetes
# .pertisk-ci.yaml: runs-on: kubernetes

kubernetes:
  namespace: ""  # same as release namespace
  helperImage: curlimages/curl:8.12.1
  buildImage: alpine:3.21
  dindImage: docker:27.5.1-dind
  ttlSecondsAfterFinished: 600

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# AMD64 cluster. For ARM, use:
#   --set-json 'nodeSelector={"kubernetes.io/arch":"arm64"}'
nodeSelector:
  kubernetes.io/arch: amd64
