# Example cluster overrides — copy to values.local.yaml (gitignored) for real deploys.
#
# Prerequisites:
#   1. PostgreSQL reachable from the cluster (existingSecret below).
#   2. Create the app secret (do not commit secrets):
#        kubectl create secret generic pertisk-gits-secret \
#          --namespace pertisk-gits \
#          --from-literal=database-url='postgres://USER:PASS@HOST:5432/pertisk_gits' \
#          --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#          --from-literal=secrets-encryption-key="$(openssl rand -hex 32)"
#   3. Shared RWX storage class (e.g. NFS) when replicaCount > 1.
#   4. TLS secret for ingress (optional).
#   5. Registry pull secret if using a private registry:
#        kubectl create secret docker-registry registry-pull \
#          --namespace pertisk-gits \
#          --docker-server=registry.example.com \
#          --docker-username='<user>' \
#          --docker-password='<pass-or-token>'
#
# Install:
#   cp deploy/helm/pertisk-gits/values.cluster.example.yaml \
#      deploy/helm/pertisk-gits/values.local.yaml
#   # edit values.local.yaml
#   helm upgrade --install pertisk-gits ./deploy/helm/pertisk-gits \
#     --namespace pertisk-gits --create-namespace \
#     -f deploy/helm/pertisk-gits/values.local.yaml

replicaCount: 2

image:
  repository: ghcr.io/example/pertisk/pertisk-gits
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Private registry — cluster needs credentials to pull (see prerequisite 5)
imagePullSecrets:
  - name: registry-pull

# Must match runner apiUrl and clone URLs
publicUrl: "https://git.example.com"

database:
  url: ""
  existingSecret:
    name: pertisk-gits-secret
    key: database-url

jwt:
  secret: ""
  existingSecret:
    name: pertisk-gits-secret
    key: jwt-secret

# Shared bare repos — required for replicaCount > 1
persistence:
  enabled: true
  size: 100Gi
  storageClass: nfs-client
  accessMode: ReadWriteMany

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: git.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pertisk-gits-tls
      hosts:
        - git.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

secrets:
  existingSecret:
    name: pertisk-gits-secret
    key: secrets-encryption-key

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pertisk-gits
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []
