apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pertisk-gits.fullname" . }}
  labels:
    {{- include "pertisk-gits.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pertisk-gits.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pertisk-gits.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8081"
            - name: GIT_PUBLIC_BASE_URL
              value: {{ .Values.publicUrl | quote }}
            - name: REPOS_ROOT
              value: /data/repos
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret.name | default (include "pertisk-gits.fullname" .) }}
                  key: {{ .Values.database.existingSecret.key | default "database-url" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.existingSecret.name | default (include "pertisk-gits.fullname" .) }}
                  key: {{ .Values.jwt.existingSecret.key | default "jwt-secret" }}
            - name: WEB_DIST
              value: /usr/share/pertisk-gits/web
            {{- if or .Values.secrets.encryptionKey .Values.secrets.existingSecret.name }}
            - name: SECRETS_ENCRYPTION_KEY
              {{- if .Values.secrets.existingSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret.name }}
                  key: {{ .Values.secrets.existingSecret.key }}
              {{- else }}
              value: {{ .Values.secrets.encryptionKey | quote }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: repos
              mountPath: /data/repos
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: repos
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pertisk-gits.fullname" . }}-repos
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
