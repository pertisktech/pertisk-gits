# Example HA overrides (multi-arch / RWX). Copy to values.local.yaml and edit.
#
# Prerequisites:
#   1. HA PostgreSQL reachable from the cluster.
#   2. kubectl create secret … database-url + jwt-secret (do not commit secrets).
#   3. RWX StorageClass (e.g. nfs-client).
#
# Install:
#   helm upgrade --install pertisk-gits ./deploy/helm/pertisk-gits \
#     --namespace pertisk-gits --create-namespace \
#     -f deploy/helm/pertisk-gits/values.local.yaml

replicaCount: 2

image:
  repository: ghcr.io/example/pertisk/pertisk-gits
  tag: "0.1.0"
  pullPolicy: IfNotPresent

publicUrl: "https://git.example.com"

database:
  url: ""
  existingSecret:
    name: pertisk-gits-secret
    key: database-url

jwt:
  secret: ""
  existingSecret:
    name: pertisk-gits-secret
    key: jwt-secret

persistence:
  enabled: true
  size: 100Gi
  storageClass: nfs-client
  accessMode: ReadWriteMany

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: git.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: pertisk-gits-tls
      hosts:
        - git.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

secrets:
  existingSecret:
    name: pertisk-gits-secret
    key: secrets-encryption-key

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pertisk-gits
          topologyKey: kubernetes.io/hostname

tolerations: []
