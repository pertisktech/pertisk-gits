# Deploy overrides for the omni-proxmox Talos cluster (NFS RWX).
#
# Prerequisites:
#   1. PostgreSQL reachable from the cluster (referenced via existingSecret below).
#   2. Create the app secret (do not commit secrets):
#        kubectl create secret generic pertisk-gits-secret \
#          --namespace pertisk-proxy \
#          --from-literal=database-url='postgres://USER:PASS@HOST:5432/pertisk_gits' \
#          --from-literal=jwt-secret="$(openssl rand -hex 32)" \
#          --from-literal=secrets-encryption-key="$(openssl rand -hex 32)" \
#          --kubeconfig /Users/nat/.kube/omni-proxmox-285h-kubeconfig.yaml
#   3. NFS StorageClass `nfs-client` present on the cluster.
#   4. TLS secret `admin-talos-tls` present in the `pertisk-proxy` namespace.
#   5. Harbor pull secret (private registry):
#        kubectl create secret docker-registry harbor-pull \
#          --namespace pertisk-proxy \
#          --docker-server=harbor.homelab.pertisk.com \
#          --docker-username='<user>' \
#          --docker-password='<pass-or-token>' \
#          --kubeconfig /Users/nat/.kube/omni-proxmox-285h-kubeconfig.yaml
#
# Install:
#   helm upgrade --install pertisk-gits ./deploy/helm/pertisk-gits \
#     --namespace pertisk-proxy --create-namespace \
#     -f deploy/helm/pertisk-gits/values-talos.yaml \
#     --kubeconfig /Users/nat/.kube/omni-proxmox-285h-kubeconfig.yaml

replicaCount: 2

image:
  repository: harbor.homelab.pertisk.com/pertisksoft/pertisk-proxy/pertisk-gits
  tag: "0.4.22"
  pullPolicy: IfNotPresent

# Private Harbor — cluster needs credentials to pull (see prerequisite 5)
imagePullSecrets:
  - name: harbor-pull

# Must match runner apiUrl and clone URLs
publicUrl: "https://gitdev.talos.pertisk.com"

database:
  url: ""
  existingSecret:
    name: pertisk-gits-secret
    key: database-url

jwt:
  secret: ""
  existingSecret:
    name: pertisk-gits-secret
    key: jwt-secret

# Shared bare repos — required for replicaCount > 1
persistence:
  enabled: true
  size: 100Gi
  storageClass: nfs-client
  accessMode: ReadWriteMany

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  className: pertisk-proxy
  annotations:
    # Large registry pushes — tune for your ingress controller
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: gitdev.talos.pertisk.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: admin-talos-tls
      hosts:
        - gitdev.talos.pertisk.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

secrets:
  existingSecret:
    name: pertisk-gits-secret
    key: secrets-encryption-key

# Spread API pods across nodes (same pattern as pertisk-runner)
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pertisk-gits
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []
