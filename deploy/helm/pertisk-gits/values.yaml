replicaCount: 1

image:
  repository: pertisk-gits
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Public URL (no trailing slash) — used for clone URLs and runner callbacks
publicUrl: "https://git.example.com"

database:
  # Full connection string. Prefer existingSecret in production.
  url: "postgres://pertisk:pertisk@postgres:5432/pertisk_gits"
  existingSecret:
    name: ""
    key: database-url

jwt:
  secret: ""
  existingSecret:
    name: ""
    key: jwt-secret

persistence:
  enabled: true
  size: 50Gi
  storageClass: ""
  accessMode: ReadWriteOnce

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: git.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
